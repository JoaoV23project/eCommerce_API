<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eCommerce SENAI - Compra</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js"></script>
    <script src="../js/compra.js"></script>
</head>

<body>
    <!--navbar-->
    <section>
        <nav>
            <h1>Compras</h1>
            <h3 class="navBarBtn" onclick="abrir('produto')">Produtos</h3>
            <h3 class="navBarBtn" onclick="abrir('cliente')">Clientes</h3>
            <h3 class="navBarBtn" onclick="abrir('funcionario')">Funcionários</h3>
            <h3 class="navBarBtn" onclick="abrir('estoque')">Estoques</h3>
            <h3 class="navBarBtn" onclick="abrir('atendimento')">Atendimentos</h3>
            <h3 class="navBarBtn" onclick="abrir('email')">Emails</h3>
            <h3 class="navBarBtn" onclick="abrir('telefone')">Telefones</h3>
            <h3 class="navBarBtn" onclick="abrir('../../index')">Home</h3>
            <h3 class="navBarBtn" onclick="abrir('relatorio')">Relatórios</h3>
        </nav>
    </section>
    <!--main-->
    <section>
        <main>
            <form>
                <input type="number" name="id" id="id" class="inputMain" value="0" style="display: none;">
                <label for="produtoID" class="labelMain">ID Produto:</label>
                <input type="number" name="produtoID" id="produtoID" class="inputMain" min="1" step="1">
                <label for="clienteID" class="labelMain">ID Cliente:</label>
                <input type="number" name="clienteID" id="clienteID" class="inputMain" min="1" step="1">
                <label for="compraDia" class="labelMain">Dia da compra:</label>
                <input type="number" name="compraDia" id="compraDia" class="inputMain" min="1" step="1" max="31">
                <label for="compraMes" class="labelMain">Mes da compra:</label>
                <input type="number" name="compraMes" id="compraMes" class="inputMain" min="1" step="1" max="12">
                <label for="compraAno" class="labelMain">Ano da compra:</label>
                <input type="number" name="compraAno" id="compraAno" class="inputMain" min="1" step="1">

                <button id="btnSalvar" onclick="salvar()">Salvar</button>
                <button id="btnSalvar" onclick="gerarPDF('Compras')">Imprimir</button>
                <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.14.0/html2pdf.bundle.min.js" integrity="sha512-+9GoO5OUX2MmPRHUH5dnOY+KGReMLcxywEvQxvAI0y5JxXh/lkz99dKj4xdYfODP3dMFsoZRz4CF/vHcaqa2Ag==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
            </form>
            <table id="pdf">
                <thead>
                    <tr>
                        <th>ID Compra</th>
                        <th>ID Produto</th>
                        <th>ID Cliente</th>
                        <th>Data da compra:</th>
                    </tr>
                </thead>
                <tbody id="corpo">
                    <!-- Dados carregados via JS -->
                </tbody>
            </table>
        </main>
    </section>
</body>

</html>
