<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eCommerce SENAI - Produto</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/script.js"></script>
    <script src="../js/produto.js"></script>

</head>
<body>
    <!--navbar-->
    <section>
        <nav>
            <h1>Produtos</h1>
            <h3 class="navBarBtn" onclick="abrir('../../index')">Home</h3>
            <h3 class="navBarBtn" onclick="abrir('cliente')">Clientes</h3>
            <h3 class="navBarBtn" onclick="abrir('funcionario')">Funcionários</h3>
            <h3 class="navBarBtn" onclick="abrir('estoque')">Estoques</h3>
            <h3 class="navBarBtn" onclick="abrir('atendimento')">Atendimentos</h3>
            <h3 class="navBarBtn" onclick="abrir('email')">Emails</h3>
            <h3 class="navBarBtn" onclick="abrir('telefone')">Telefones</h3>
            <h3 class="navBarBtn" onclick="abrir('compra')">Compras</h3>
            <h3 class="navBarBtn" onclick="abrir('relatorio')">Relatórios</h3>
        </nav>
    </section>
    <!--main-->
    <section>
        <main>
            <form>
                <input type="number" name="id" id="id" class="inputMain" value="0" style="display: none;">
                <label for="nome" class="labelMain">Nome:</label>
                <input type="text" name="nome" id="nome" class="inputMain">
                <label for="desc" class="labelMain">Descrição:</label>
                <input type="text" name="desc" id="desc" class="inputMain">
                <label for="preco" class="labelMain">Preço de venda:</label>
                <input type="number" step="0.01" name="preco" id="preco" class="inputMain">
                <label for="qtd" class="labelMain">Quantidade:</label>
                <input type="number" name="qtd" id="qtd" class="inputMain" min="0" step="1" ononkeydown="if(event.key==='.' || event.key==='-') event.preventDefault();">
                <button id="btnSalvar" onclick="salvar()">Salvar</button>
                <button id="btnSalvar" onclick="gerarPDF('Produtos')">Imprimir</button>
                <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.14.0/html2pdf.bundle.min.js" integrity="sha512-+9GoO5OUX2MmPRHUH5dnOY+KGReMLcxywEvQxvAI0y5JxXh/lkz99dKj4xdYfODP3dMFsoZRz4CF/vHcaqa2Ag==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
            </form>
            <table id="pdf">
                <thead>
                    <tr>
                        <th>ID Produto</th>
                        <th>Nome</th>
                        <th>Descrição</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                    </tr>
                </thead>
                    <tbody id="corpo">
                        <!-- Dados carregados via JS -->
                    </tbody>
                </table>
            </main>
        </section>
    </body>
</html>
